name: Build Edrol AI Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Install Native Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # 🔴 STEP 1: Fix Android v1 Embedding
      - name: Fix Android v1 Embedding
        run: flutter create --platforms=android --org com.edrtpyam.aditibot .

      # 🔴 STEP 2: Setup Custom build.gradle for Llama
      - name: Setup Custom build.gradle for Llama
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services" version "4.4.1" 
          }

          android {
              namespace "com.edrtpyam.aditibot"
              compileSdk flutter.compileSdkVersion

              ndkVersion "25.2.9519653"

              externalNativeBuild {
                  cmake {
                      version "3.22.1"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId "com.edrtpyam.aditibot"
                  minSdk 24
                  targetSdk flutter.targetSdkVersion
                  versionCode flutter.versionCode
                  versionName flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      # 🔴 STEP 3: NDK 25 Install Karna aur Environment ko force karna
      - name: Install and Force NDK 25
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          sudo rm -rf ${ANDROID_HOME}/ndk/28.*

      # 🔴 STEP 4: Build APK with STRICT Environment Variables
      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROID_NDK_VERSION: 25.2.9519653
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Edrol-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
