name: Build Edrol AI Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Native Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Fix Android v1 Embedding
        run: flutter create --platforms=android --org com.edrtpyam.aditibot .

      - name: Force NDK 25 for ALL Packages
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          ndkVersion "25.2.9519653"
                      }
                  }
              }
          }
          EOF

      # 🔴 HACK 1: App Settings mein Low RAM aur Single Architecture Force karna
      - name: Setup Custom App Gradle (LOW RAM MODE)
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services" version "4.4.1" 
          }

          android {
              namespace "com.edrtpyam.aditibot"
              compileSdk flutter.compileSdkVersion

              ndkVersion "25.2.9519653"

              defaultConfig {
                  applicationId "com.edrtpyam.aditibot"
                  minSdk 24
                  targetSdk flutter.targetSdkVersion
                  versionCode flutter.versionCode
                  versionName flutter.versionName

                  // 🔴 EXTREME HACK: Sirf 64-bit phones ke liye C++ banao, load aadha ho jayega
                  ndk {
                      abiFilters 'arm64-v8a'
                  }

                  externalNativeBuild {
                      cmake {
                          // 🔴 EXTREME HACK: C++ compiler ko bolo sirf 1 core use kare taaki RAM full na ho
                          arguments "-DCMAKE_BUILD_PARALLEL_LEVEL=1"
                      }
                  }
              }

              externalNativeBuild {
                  cmake { version "3.22.1" }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
              buildTypes {
                  release { signingConfig signingConfigs.debug }
              }
          }
          EOF

      # 🔴 HACK 2: Gradle ko background mein RAM khane se rokna
      - name: Set Low RAM Gradle Properties
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=1" >> android/gradle.properties

      # 🔴 HACK 3: Flutter aur Make command ko strictly 1 thread pe limit karna
      - name: Build Android APK (Strict arm64)
        run: flutter build apk --release --target-platform android-arm64
        env:
          MAKEFLAGS: "-j1"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Edrol-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
