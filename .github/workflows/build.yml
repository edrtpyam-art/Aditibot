name: Build Edrol AI Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔴 Zaroori Step: C++ Compile karne ke tools install karna
      - name: Install Native Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Fix Android v1 Embedding
        run: flutter create --platforms=android --org com.edrtpyam.aditibot .

      # 🔴 MASTER FIX 1: Llama Package ko NDK 25 force karne ke liye
      - name: Force NDK 25 for ALL Packages
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          ndkVersion "25.2.9519653"
                      }
                  }
              }
          }
          EOF

      # 🔴 MASTER FIX 2: App settings, Firebase aur MinSDK 24 ke liye
      - name: Setup Custom App Gradle
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services" version "4.4.1" 
          }

          android {
              namespace "com.edrtpyam.aditibot"
              compileSdk flutter.compileSdkVersion

              ndkVersion "25.2.9519653"

              externalNativeBuild {
                  cmake { version "3.22.1" }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions { jvmTarget = '1.8' }

              defaultConfig {
                  applicationId "com.edrtpyam.aditibot"
                  minSdk 24
                  targetSdk flutter.targetSdkVersion
                  versionCode flutter.versionCode
                  versionName flutter.versionName
              }

              buildTypes {
                  release { signingConfig signingConfigs.debug }
              }
          }
          EOF

      # 🔴 MASTER FIX 3: GitHub Server ko 10GB extra RAM (Swap) dena taaki C++ build memory full hoke crash na ho
      - name: Create Extra Swap Memory for C++ Compilation
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=10

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Edrol-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
