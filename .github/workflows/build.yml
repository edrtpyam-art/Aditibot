name: Build Edrol AI Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      # 🔴 C++ aur Llama AI compile karne ke liye tools add kiye
      - name: Install Native Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Check Versions
        run: |
          java -version
          gradle --version
          flutter --version
          cmake --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # 🔴 YE LINE ANDROID EMBEDDING KE LAFDE KO KHATAM KAREGI
      - name: Recreate Android Project
        run: flutter create --platforms=android --org com.dragoeagle.edrolai .

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Edrol-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
