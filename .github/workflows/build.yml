name: Build Edrol AI Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Fix Android v1 Embedding
        run: flutter create --platforms=android --org com.edrtpyam.aditibot .

      # 🔴 NAYA STEP 1: App ka naam 'edrol_ai' se theek karke 'Edrol AI' karna
      - name: Fix App Name
        run: sed -i 's/android:label="edrol_ai"/android:label="Edrol AI"/g' android/app/src/main/AndroidManifest.xml

      # 🔴 NAYA STEP 2: App ka professional logo wapas generate karna
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --release
