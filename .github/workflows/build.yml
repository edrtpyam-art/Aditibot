name: Build Edrol AI Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Fix Android v1 Embedding
        run: flutter create --platforms=android --org com.edrtpyam.aditibot .

      - name: Fix App Name
        run: sed -i 's/android:label="edrol_ai"/android:label="Edrol AI"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons || true

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Edrol-AI-Android-APK
          # 🔴 MAGIC FIX: Yeh line APK ko kisi bhi folder se dhoond nikalegi
          path: build/app/outputs/**/*.apk
          retention-days: 1
