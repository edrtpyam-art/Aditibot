name: Build Edrol AI Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Manually start karne ke liye

jobs:
  build:
    # Android build ke liye ubuntu fast aur free hota hai
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Edrol-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1 # Yahan tera smart logic hai: 1 din baad automatic delete
