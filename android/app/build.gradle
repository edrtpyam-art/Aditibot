plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    
    // 🔴 FIX: Yahan Firebase ka version number "4.4.1" add kar diya gaya hai
    id "com.google.gms.google-services" version "4.4.1" 
}

android {
    namespace "com.edrtpyam.aditibot"
    compileSdk flutter.compileSdkVersion

    // 🔴 Llama Offline Model C++ Build Error Rokne Ke Liye
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.edrtpyam.aditibot"
        
        // 🔴 Llama model sirf SDK 24 ya uske upar chalta hai
        minSdk 24
        
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
