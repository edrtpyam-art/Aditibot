plugins {
    id "com.android.application"
    id "kotlin-android"
    // 🔴 NAYA: Flutter ka naya plugin apply karne ka tarika
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" // Firebase ke liye
}

android {
    namespace "com.edrtpyam.aditibot"
    
    // 🔴 FIX: 'compileSdkVersion' ab 'compileSdk' ban gaya hai
    compileSdk flutter.compileSdkVersion

    // 🔴 FIX: Llama Offline Model C++ Build Error Rokne Ke Liye
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.edrtpyam.aditibot"
        
        // 🔴 FIX: Llama model sirf SDK 24 ya uske upar chalta hai
        minSdk 24
        
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
