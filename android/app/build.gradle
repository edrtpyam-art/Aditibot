plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    
    // 🔴 Firebase Fix
    id "com.google.gms.google-services" version "4.4.1" 
}

android {
    namespace "com.edrtpyam.aditibot"
    compileSdk flutter.compileSdkVersion

    // 🔴 C++ BUILD FIX 1: Llama Offline Model ke liye Stable NDK Version
    ndkVersion "25.1.8937393"

    // 🔴 C++ BUILD FIX 2: GitHub server ko crash se bachane ke liye CMake setting
    externalNativeBuild {
        cmake {
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.edrtpyam.aditibot"
        
        // 🔴 FIX 3: Llama offline AI sirf SDK 24 ya uske upar hi chalta hai
        minSdk 24
        
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
